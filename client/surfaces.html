<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Живой город — покрытия</title><style>
*{box-sizing:border-box}body{margin:0;background:#d8dcc9;color:#23362a;font:15px system-ui}canvas{display:block;width:100vw;height:100dvh}nav{position:fixed;inset:14px 14px auto;max-width:620px;margin:auto;padding:14px;background:#fcfaf1ee;border:1px solid #b7bdab;border-radius:16px;box-shadow:0 6px 22px #27372912}h1{font-size:20px;margin:0 0 5px}p{margin:5px 0 10px;font-size:13px;color:#5e6b5c}.buttons{display:flex;gap:6px;flex-wrap:wrap}button,a{font:inherit;border:1px solid #bec5b3;border-radius:10px;padding:8px 11px;background:#fffdf6;color:#304830;text-decoration:none;cursor:pointer}button[aria-pressed=true]{background:#304b35;color:#fff}footer{position:fixed;bottom:14px;left:14px;right:14px;max-width:620px;margin:auto;display:flex;align-items:center;gap:12px;background:#fcfaf1eb;padding:10px;border-radius:12px}input{flex:1;min-width:50px;accent-color:#416247}footer span{font-size:13px}a{font-size:13px}@media(max-width:480px){h1{font-size:18px}nav{padding:12px}.buttons button{font-size:13px;padding:8px}p{font-size:12px}}
</style></head><body><canvas id="material" aria-label="Покрытия посёлка"></canvas><nav><h1>Земля, по которой ходят</h1><p id="description">Один базовый рисунок травы: зелень, сухие места, пучки и редкие листья.</p><div class="buttons"><button data-view="grass" aria-pressed="true">Трава</button><button data-view="asphalt" aria-pressed="false">Асфальт</button><button data-view="broken" aria-pressed="false">Разбитая дорога</button><button data-view="dirt" aria-pressed="false">Грунтовка</button></div></nav><footer><span>Масштаб</span><input id="scale" type="range" min="0.3" max="1.6" step="0.05" value="1.3" aria-label="Масштаб покрытия"><a href="./">В посёлок</a></footer><script type="module" src="surface-review.js"></script></body></html>
