<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Походка рабочего — Живой город</title><style>
*{box-sizing:border-box}body{margin:0;background:#d8d7c9;color:#293b30;font:15px system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:25px 18px}a{color:#315d40}h1{font:32px Georgia,serif;margin:20px 0 8px}p{line-height:1.6}canvas{display:block;width:100%;background:#d8d7c9;border-bottom:1px solid #b3b7a2}nav{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:18px 0}button,select{font:inherit;border:1px solid #75886b;background:#304b38;color:#f3efdc;border-radius:4px;padding:10px}button:focus-visible,select:focus-visible{outline:3px solid #b77c2b}.portraits{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.portraits img{width:100%;display:block}@media(max-width:600px){.portraits{grid-template-columns:1fr}.portraits img{max-width:384px;margin:auto}}h2{font:24px Georgia,serif}small{color:#526049}#error{color:#8f3027}
</style></head><body><main><a href="./">← Вернуться в посёлок</a><h1>Походка рабочего</h1><p>Слева — предыдущая модель, справа — доработанная модель и походка. Можно посмотреть с разных сторон и остановить движение.</p><canvas width="960" height="460" aria-label="Сравнение старой и новой походки"></canvas><nav><button id="pause">Пауза</button><label>Вид <select id="direction"><option value="0">В три четверти</option><option value="3">Сбоку</option><option value="4">Со спины</option><option value="6">С другой стороны</option></select></label><button id="slow">Медленно</button></nav><small>Это просмотр анимации. В посёлке шаги связаны с пройденным расстоянием.</small><h2>Форма рабочего крупно</h2><div class="portraits"><img src="assets/worker-front.jpg" alt="Новая модель рабочего спереди"><img src="assets/worker-side.jpg" alt="Новая модель рабочего сбоку"><img src="assets/worker-back.jpg" alt="Новая модель рабочего сзади"></div><p id="error" role="status"></p></main><script type="module">
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let before,after,oldMeta,meta,t=0,last=performance.now(),paused=false,slow=false;
async function load(name){const im=new Image();im.src='assets/'+name+'.png';await im.decode();return im}
try{[before,after,oldMeta,meta]=await Promise.all([load('worker-before'),load('worker'),fetch('assets/worker-before.json').then(r=>r.json()),fetch('assets/worker.json').then(r=>r.json())]);window.walkReady=true}catch(e){document.querySelector('#error').textContent='Не удалось загрузить анимацию. Обнови страницу.';console.error(e)}
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Продолжить':'Пауза'};document.querySelector('#slow').onclick=e=>{slow=!slow;e.target.textContent=slow?'Обычная скорость':'Медленно'};
function draw(im,m,x,newer){const d=Number(document.querySelector('#direction').value),info=m.states.walk;const frame=info.start+Math.floor(t*(info.fps||m.fps))%info.count;const scale=1.45*288/m.frameHeight,w=m.frameWidth,h=m.frameHeight;
ctx.fillStyle='#48604422';ctx.beginPath();ctx.ellipse(x,370,58,17,0,0,Math.PI*2);ctx.fill();ctx.drawImage(im,(frame%m.columns)*w,(d*(m.directionRows||1)+Math.floor(frame/m.columns))*h,w,h,x-w*.5*scale,370-m.anchor[1]*scale,w*scale,h*scale)}
function animate(now){if(!paused)t+=Math.min((now-last)/1000,.1)*(slow?.35:1);last=now;ctx.clearRect(0,0,960,460);ctx.fillStyle='#293b30';ctx.font='20px system-ui';ctx.textAlign='center';ctx.fillText('Предыдущая модель',240,35);ctx.fillText('Новая модель',720,35);ctx.strokeStyle='#a3ad94';ctx.beginPath();ctx.moveTo(480,60);ctx.lineTo(480,425);ctx.stroke();if(before&&after&&meta&&oldMeta){draw(before,oldMeta,240,false);draw(after,meta,720,true)}requestAnimationFrame(animate)}requestAnimationFrame(animate)
</script></body></html>
